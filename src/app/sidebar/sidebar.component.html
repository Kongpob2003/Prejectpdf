<aside class="sidebar" [class.minimal]="mode === 'minimal'">

  <!-- Logo -->
  <div class="logo-box" (click)="go('/userhome')">
    <span class="material-icons logo-icon">picture_as_pdf</span>
    <span class="logo-text">MyPDF</span>
  </div>

  <!-- ===== FULL MODE ===== -->
  <ul *ngIf="mode === 'full'">
    <li
      [class.active]="isActive('/userhome')"
      (click)="go('/userhome')"
    >
      <span class="material-icons">home</span>
      หน้าหลัก
    </li>

    <li
      [class.active]="isActive('/userprofile')"
      (click)="go('/userprofile')"
    >
      <span class="material-icons">person</span>
      ข้อมูลส่วนตัว
    </li>

    <li
      [class.active]="isActive('/usercalender')"
      (click)="go('/usercalender')"
    >
      <span class="material-icons">calendar_month</span>
      ปฏิทิน
    </li>

    <li
      [class.active]="isActive('/userrelation')"
      (click)="go('/userrelation')"
    >
      <span class="material-icons">campaign</span>
      ประชาสัมพันธ์
    </li>

    <li
      [class.active]="isActive('/userjae')"
      (click)="go('/userjae')"
    >
      <span class="material-icons">description</span>
      JAE
    </li>

    <li
      [class.active]="isActive('/userqualityassurance')"
      (click)="go('/userqualityassurance')"
    >
      <span class="material-icons">verified</span>
      ประกันคุณภาพ
    </li>

    <li class="logout" (click)="logout()">
      <span class="material-icons">logout</span>
      ออกจากระบบ
    </li>
  </ul>

  <!-- ===== MINIMAL MODE ===== -->
  <button
    *ngIf="mode === 'minimal'"
    class="back-btn"
    (click)="go('/userhome')"
  >
    <span class="material-icons">arrow_back</span>
    กลับหน้าหลัก
  </button>

</aside>
