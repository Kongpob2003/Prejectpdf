<aside class="sidebar" [class.minimal]="mode === 'minimal'">

  <!-- Logo -->
  <div class="logo-box" (click)="go('/userhome')">
    <span class="material-icons logo-icon">picture_as_pdf</span>
    <span class="logo-text">MyPDF</span>
  </div>

  <!-- ===== FULL MODE ===== -->
  <ul *ngIf="mode === 'full'">
    <li
      [class.active]="isActive('/home')"
      (click)="go('/home')"
    >
      <span class="material-icons">home</span>
      หน้าหลัก
    </li>

    <li
      [class.active]="isActive('/profile')"
      (click)="go('/profile')"
    >
      <span class="material-icons">person</span>
      ข้อมูลส่วนตัว
    </li>

    <li
      [class.active]="isActive('/calender')"
      (click)="go('/calender')"
    >
      <span class="material-icons">calendar_month</span>
      ปฏิทิน
    </li>

    <li
      [class.active]="isActive('/adddeleteuser')"
      (click)="go('/adddeleteuser')"
    >
      <span class="material-icons">person_add</span>
      เพิ่มลดผู้ใช้
    </li>

    <li
      [class.active]="isActive('/relation')"
      (click)="go('/relation')"
    >
      <span class="material-icons">campaign</span>
      ประชาสัมพันธ์
    </li>

    <li
      [class.active]="isActive('/jae')"
      (click)="go('/jae')"
    >
      <span class="material-icons">description</span>
      JAE
    </li>

    <li
      [class.active]="isActive('/qualityassurance')"
      (click)="go('/qualityassurance')"
    >
      <span class="material-icons">verified</span>
      ประกันคุณภาพ
    </li>

    <li
      [class.active]="isActive('/category')"
      (click)="go('/category')"
    >
      <span class="material-icons">calendar_month</span>
      ปฏิทิน
    </li>

    <li class="logout" (click)="logout()">
      <span class="material-icons">logout</span>
      ออกจากระบบ
    </li>
  </ul>

  <!-- ===== MINIMAL MODE ===== -->
  <button
    *ngIf="mode === 'minimal'"
    class="back-btn"
    (click)="go('/userhome')"
  >
    <span class="material-icons">arrow_back</span>
    กลับหน้าหลัก
  </button>

</aside>
