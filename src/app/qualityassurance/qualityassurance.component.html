<div class="home-container">
  <app-adminsidebar [mode]="'full'"></app-adminsidebar>

  <main class="content">
    <!-- ===== Folder View ===== -->
    <div *ngIf="!selectedFolder">
      <h2 class="page-title">
        <span class="material-icons">folder</span>
        ประกันคุณภาพ
      </h2>

      <div class="create-row">
        <input type="text" placeholder="ชื่อโฟลเดอร์" [(ngModel)]="newFolderName" />
        <button class="btn" (click)="createFolder()">➕ สร้างโฟลเดอร์</button>
      </div>

      <div class="folder-grid">
        <div class="folder-card" *ngFor="let f of folders" (click)="openFolder(f)">
          <span class="material-icons folder-delete" (click)="deleteFolder($event, f)">
            delete
          </span>

          <span class="material-icons folder-icon">folder</span>
          <div class="folder-name">{{ f.name }}</div>
        </div>
      </div>

      <p *ngIf="folders.length === 0" class="empty-text">ยังไม่มีโฟลเดอร์</p>
    </div>

    <!-- ===== File View ===== -->
    <div *ngIf="selectedFolder" class="file-view">
      <div class="folder-header">
        <button class="back-link" (click)="backToFolders()">←</button>
        <h2>{{ selectedFolder.name }}</h2>
      </div>

      <label class="upload-box">
        <span class="material-icons upload-icon">cloud_upload</span>
        <div class="upload-text">เพิ่มไฟล์จากเครื่อง</div>
        <div class="upload-sub">ลากไฟล์มาวาง หรือคลิกเพื่อเลือก</div>
        <input type="file" (change)="onFileSelected($event)" />
      </label>

      <div class="file-list" *ngIf="selectedFolder.files.length > 0">
        <div class="file-item" *ngFor="let file of selectedFolder.files" (click)="openFile(file)">
          <span class="material-icons file-icon-color">description</span>

          <div class="text-content">
            <div class="file-name">{{ file.name }}</div>
            <small *ngIf="!file.url" style="color: orange">(รออัปโหลด)</small>
          </div>
          <!-- ปุ่มลบเอกสาร -->
          <span
            class="material-icons file-delete"
            title="ลบเอกสาร"
            (click)="deleteFile($event, file)"
          >
            delete
          </span>

          <span class="material-icons open-icon" *ngIf="file.url"> open_in_new </span>

          <span class="material-icons open-icon" *ngIf="file.url"> open_in_new </span>
        </div>
      </div>

      <p *ngIf="selectedFolder.files.length === 0" class="empty-text">ยังไม่มีไฟล์ในโฟลเดอร์นี้</p>
    </div>
  </main>
</div>
