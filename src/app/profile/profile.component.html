<div class="home-container">
  <!-- Sidebar -->
  <app-adminsidebar [mode]="'full'"></app-adminsidebar>
  <!-- Content -->
  <main class="content center-content">
    <div class="profile-card">
      <div class="profile-header">
        <span class="material-icons avatar">account_circle</span>
        <div>
          <h2>ข้อมูลส่วนตัว</h2>
          <p>จัดการข้อมูลบัญชีของคุณ</p>
        </div>
      </div>

      <div class="profile-form">
        <!-- Username -->
        <div class="form-group">
          <label>ชื่อผู้ใช้</label>
          <input
            type="text"
            [(ngModel)]="profile.username"
            [disabled]="!isEditing"
          />
          <small class="error" *ngIf="usernameError">
            กรุณากรอกชื่อผู้ใช้ (ห้ามเว้นว่าง)
          </small>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label>อีเมล</label>
          <input
            type="email"
            [(ngModel)]="profile.email"
            [disabled]="!isEditing"
            pattern="^[a-zA-Z0-9._%+-]+@gmail\.com$"
          />
          <small class="error" *ngIf="emailError">
            ต้องเป็นภาษาอังกฤษ และลงท้ายด้วย @gmail.com
          </small>
          <small class="error" *ngIf="emailDuplicateError" style="color: red;">
            ⚠️ อีเมลนี้ถูกใช้งานโดยบัญชีอื่นแล้ว
          </small>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label>รหัสผ่าน</label>
          <input
            type="password"
            [(ngModel)]="profile.password"
            [disabled]="!isEditing"
          />
          <small class="error" *ngIf="passwordError">
            รหัสผ่านต้องมีอย่างน้อย 4 ตัวอักษร
          </small>
        </div>

        <!-- Phone -->
        <div class="form-group">
          <label>เบอร์โทร</label>
          <input
            type="text"
            maxlength="10"
            [(ngModel)]="profile.phone"
            [disabled]="!isEditing"
            (input)="profile.phone = profile.phone.replace(/[^0-9]/g, '')"
          />
          <small class="error" *ngIf="phoneError">
            เบอร์โทรต้องเป็นตัวเลข 10 หลัก
          </small>
        </div>
      </div>

      <div class="profile-actions">
        <button
          *ngIf="!isEditing"
          class="btn-edit"
          (click)="editProfile()"
        >
          แก้ไขข้อมูล
        </button>

        <button
          *ngIf="isEditing"
          class="btn-save"
          (click)="saveProfile()"
        >
          บันทึกข้อมูล
        </button>
      </div>
    </div>
  </main>
</div>
